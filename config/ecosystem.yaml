# config/ecosystem.yaml
# Single source of truth for the Marmalio World ecosystem.
# Human-readable rationale lives in docs/ARCHITECTURE_V2_2_MULTI_REVENUE.md,
# docs/COMPLIANCE_GATES_2026.md, docs/KIMI_INTEGRATION_2026.md, AGENTS.md and docs/PROJECT_PLAN.md.

version: 3

operating_model:
  chain:
    - human
    - chatgpt
    - repository-handoff
    - claude-code-or-assigned-codex-or-assigned-kimi
    - specialist-agents
    - qa
    - human-approval
  responsibilities:
    human: Sets intent and priorities; gives final approval on publishing, production, spending, account creation, external outreach, destructive actions, and major architecture changes
    chatgpt: Strategic manager and architect; sets direction, priorities, and high-level design decisions
    repository_handoff: Durable specs, decisions, prompts, schemas and audit trail shared across agents
    claude_code_or_assigned_codex_or_assigned_kimi: Claude Code is primary implementation layer; Codex and Kimi may implement when explicitly assigned non-overlapping files/tasks
    specialist_agents: Execute focused work within research, product building, localization, compliance and QA
    qa: Reviews work before publishing

ai_team:
  chatgpt:
    role: manager-architect
    status: core-now
  claude-code:
    role: primary-implementation
    status: core-now
  codex:
    role: independent-repo-review-tests-and-assigned-implementation
    status: core-now
  kimi:
    role: long-context-research-batch-qa-third-opinion-and-assigned-overflow-implementation
    status: pilot
    spec: docs/KIMI_INTEGRATION_2026.md
    rules:
      - no-duplicate-file-ownership
      - plan-mode-first-for-review
      - no-auto-publish-spend-or-account-actions
      - durable-output-goes-to-repository

revenue_model:
  strategy: multi-revenue
  gate:
    id: R10
    definition: 10 real paid customer orders across the live Marmalio digital-product portfolio
  engines:
    - id: digital-products
      status: core-now
    - id: media-audience
      status: core-now
    - id: amazon-factory
      status: now
    - id: affiliate-engine
      status: now
    - id: physical-commerce
      status: later
    - id: a11y-evidence
      status: hold

modules:
  - id: product-factory
    name: Product Factory / Digital Product Microfactory
    status: now
  - id: content-factory
    name: Content Factory
    status: now
  - id: content-intelligence
    name: Content Intelligence / Faceless Growth Engine
    status: now
  - id: amazon-factory
    name: Amazon Factory
    status: now
  - id: affiliate-engine
    name: Affiliate Engine
    status: now
  - id: physical-commerce
    name: Physical Commerce / Shopify Integration
    status: later
  - id: creative-generation-gateway
    name: Creative Generation Gateway
    status: now
  - id: tool-registry
    name: Tool Registry
    status: now
  - id: research-market-validation
    name: Research and market validation
    status: pilot
  - id: localization
    name: Localization
    status: now
  - id: compliance-qa
    name: Compliance and QA
    status: now
  - id: micro-app-factory
    name: Micro-App Factory / App Venture Lab
    status: later

localization:
  target_languages: 17
  working_set:
    - en
    - de
    - es
    - fr
    - pt
    - pl
    - it
    - nl
    - ja
    - ko
    - ar
    - tr
    - id
    - hi
    - zh-Hans
    - sv
    - cs
  rollout: tiered

commerce:
  digital_validation:
    primary: lemon-squeezy
    status: core-now
  shopify:
    status: deferred
    reactivate_when:
      - physical-products
      - dropshipping
      - approved-storefront-need

content:
  channels:
    - youtube-long
    - youtube-shorts
    - tiktok
    - instagram-reels
  classes:
    - sales-content
    - media-asset
  kids_lane:
    status: gated
    separate_channel_required: true
    compliance_checklist_required: true

amazon:
  kdp:
    status: now-after-compliance
    ai_generated_disclosure_required_when_platform_requires: true
  merch:
    status: now-after-compliance
    ip_check_required: true

agent_roles:
  - id: research
    purpose: Market, trend, product and competitor investigation
  - id: product-builder
    purpose: Turn validated ideas into shippable premium product work
  - id: localization
    purpose: Adapt products/content across languages and markets
  - id: compliance
    purpose: Legal, platform-policy, licensing, privacy and safety checks
  - id: qa
    purpose: Quality assurance and review before publishing

qa:
  min_score: 85
  scale: 100
  mandatory_before_publish: true

approval_required:
  - publishing
  - production-deployment
  - spending
  - account-creation
  - cold-outreach
  - destructive-actions
  - major-architectural-change
  - regulated-physical-products

privacy:
  customer_pii_allowed_systems:
    - approved-commerce-system
    - approved-correspondence-system
  forbidden_destinations:
    - github
    - notion
    - google-drive
    - generic-ai-prompts
    - make-blueprints
    - generic-logs

channels:
  core_now:
    - lemon-squeezy
    - youtube
    - tiktok
    - instagram
    - amazon-kdp
    - amazon-merch
    - affiliate
  later:
    - shopify-physical
    - dropshipping

automation:
  pre_R10:
    make_production_dependency: false
  post_R10:
    make_role:
      - cross-saas-routing
      - mapping
      - retries
      - notifications
  github_actions_role:
    - repo-triggered-automation
    - tests
    - release-workflows
  business_logic_location: repository

compliance:
  master_file: docs/COMPLIANCE_GATES_2026.md
  a11y_status_file: docs/A11Y_EVIDENCE_G1_STATUS.md
  mandatory_before_launch: true

principles:
  - revenue-first
  - premium-over-volume
  - multi-revenue-but-controlled
  - trend-informed-not-hype-driven
  - localize-winners
  - keep-docs-in-sync
  - never-expose-secrets-or-customer-pii
  - validate-external-claims-before-treating-as-fact
  - human-approval-for-high-impact-actions
